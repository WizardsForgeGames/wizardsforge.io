<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>ウィザーズフォージ — Crucible</title>
    <meta name="description" content="Crucible。ウィザーズフォージより近日公開。">
    <meta name="theme-color" content="#0b0b14">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Wizard's Forge">
    <meta property="og:title" content="Crucible">
    <meta property="og:description" content="ウィザーズフォージより近日公開。">

    <link rel="icon" type="image/svg+xml" href="/wizards_forge_bold_v4_1024.svg">
    <link rel="alternate" hreflang="en" href="/en/">
    <link rel="alternate" hreflang="ja" href="/ja/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        .hud, .teaser-status, footer { font-family: 'Noto Sans JP', var(--mono); }
    </style>
</head>
<body>
    <div class="container">
        <header class="hero">
            <svg class="hero-logo" viewBox="-2.0 -2.0 27.5 27.5" role="img" aria-label="ウィザーズフォージ ロゴ">
                <path class="stroke" pathLength="1" d="M 1.417 23.244 C 21.827 23.244 22.610 23.244 23.244 22.610 L 23.244 21.827 C 23.244 1.417 23.244 0.634 22.610 0.0 L 21.827 0.0 C 1.417 0.0 0.634 0.0 0.0 0.634 L 0.0 1.417 C 0.0 21.827 0.0 22.610 0.634 23.244 Z" stroke="#f97216" fill="none" stroke-width="1.275" stroke-linejoin="round"/>
                <path class="stroke" pathLength="1" d="M 11.622 4.184 L 4.184 19.060 L 19.060 19.060 Z" stroke="#f97216" fill="none" stroke-width="1.559" stroke-linejoin="round"/>
                <circle class="core" cx="11.622" cy="16.736" r="1.559" fill="#f97216"/>
            </svg>
            <div class="hero-brand">Wizard's Forge</div>
        </header>

        <main class="teaser">
            <div class="teaser-stage" data-heat>
                <canvas aria-hidden="true"></canvas>
                <span class="corner tl"></span><span class="corner tr"></span>
                <span class="corner bl"></span><span class="corner br"></span>
                <div class="teaser-title">
                    <h1 class="teaser-name"><span>Crucible</span></h1>
                    <div class="teaser-status"><span class="status-dot"></span>近日公開</div>
                </div>
                <div class="hud hud-hint" data-touch="ドラッグで熱を加える">カーソルを動かして熱を加える</div>
            </div>
        </main>

        <footer>
            <div class="people">
                <div class="person"><span class="person-name">サンダー・ダレン</span><a href="mailto:darren@wizardsforge.io">darren@wizardsforge.io</a></div>
                <div class="person"><span class="person-name">フーバー・アレクサンダー</span><a href="mailto:alexander@wizardsforge.io">alexander@wizardsforge.io</a></div>
            </div>
            <div class="footer-links">
                <a href="https://github.com/WizardsForgeGames" target="_blank" rel="noopener">GitHub</a>
                <a href="../darren-sander.vcf" download>ダレンの連絡先を保存</a>
            </div>
            <div class="lang-switch">
                <a href="/en/" onclick="document.cookie='lang=en;path=/;max-age=31536000;SameSite=Lax;Secure';">EN</a>
                <span>|</span>
                <span class="lang-current">日本語</span>
            </div>
            <p>&copy; 2026 Wizard's Forge</p>
        </footer>
    </div>
    <script src="/assets/heat.js" defer></script>
</body>
</html>
